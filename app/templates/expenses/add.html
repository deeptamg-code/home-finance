
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {{ 'Edit Expense' if expense else 'Add Expense' }} | Home Finance
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-expenses-add">

    <nav class="navbar">
        <a href="{{ url_for('main.dashboard') }}">
            <img class="site-logo" src="{{ url_for('static', filename='kd-logo.jpg') }}" alt="">Home Finance</strong>
        </a>
    </nav>

    <main class="container">

        <div class="section">

            <h1>
                {{ 'Edit Expense' if expense else 'Add Expense' }}
            </h1>

            <p>Enter your expense information below.</p>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <!-- Expense form -->
            <form
                method="POST"
                action="{{ url_for('expenses.edit', expense_id=expense.id) if expense else url_for('expenses.add') }}"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <!-- Expense title -->
                <label for="title">Expense Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ request.form.get('title', expense.title if expense else '') }}"
                    placeholder="e.g. Monthly groceries"
                    required
                >

                <!-- Category -->
                <label for="category_id">Category</label>

                <select
                    id="category_id"
                    name="category_id"
                    required
                >

                    <option value="">Select Category</option>

                    {% set selected_category = request.form.get(
                        'category_id',
                        expense.category_id|string if expense else ''
                    ) %}

                    {% for category in categories %}

                        <option
                            value="{{ category.id }}"
                            {% if selected_category == category.id|string %}
                                selected
                            {% endif %}
                        >
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

                <!-- Amount -->
                <label for="amount">Amount (JPY)</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0.01"
                    value="{{ request.form.get('amount', expense.amount if expense else '') }}"
                    placeholder="e.g. 3000"
                    required
                >

                <!-- Expense date -->
                <label for="expense_date">Expense Date</label>

                <input
                    type="date"
                    id="expense_date"
                    name="expense_date"
                    value="{{ request.form.get('expense_date', expense.expense_date.isoformat() if expense else '') }}"
                    required
                >

                <!-- Note -->
                <label for="note">Note (Optional)</label>

                <textarea
                    id="note"
                    name="note"
                    rows="4"
                    placeholder="Additional information"
                >{{ request.form.get('note', (expense.note or '') if expense else '') }}</textarea>

                <!-- Submit -->
                <button type="submit" class="button">
                    {{ 'Update Expense' if expense else 'Save Expense' }}
                </button>

                <a
                    href="{{ url_for('expenses.index') }}"
                    class="back"
                >
                    Cancel
                </a>

            </form>

        </div>

    </main>

</body>
</html>
