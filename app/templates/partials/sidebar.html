{% if current_user.is_authenticated %}
<aside class="app-sidebar">
    <a class="sidebar-brand" href="{{ url_for('main.dashboard') }}">
        <img src="{{ url_for('static', filename='kd-logo.jpg') }}" alt="KD">
        <span><strong>HOME</strong><small>FINANCE</small></span>
    </a>
    <div class="sidebar-caption">MAIN MENU</div>
    <nav class="sidebar-nav" aria-label="Main navigation">
        <a href="{{ url_for('main.dashboard') }}" class="{% if request.endpoint == 'main.dashboard' %}active{% endif %}"><span>⌂</span>Dashboard</a>
        <a href="{{ url_for('income.index') }}" class="{% if request.endpoint and request.endpoint.startswith('income.') %}active{% endif %}"><span>↗</span>Income</a>
        <a href="{{ url_for('expenses.index') }}" class="{% if request.endpoint and request.endpoint.startswith('expenses.') %}active{% endif %}"><span>↘</span>Expenses</a>
        <a href="{{ url_for('savings.index') }}" class="{% if request.endpoint and request.endpoint.startswith('savings.') %}active{% endif %}"><span>◇</span>Savings</a>
        <a href="{{ url_for('loans.index') }}" class="{% if request.endpoint and request.endpoint.startswith('loans.') %}active{% endif %}"><span>▤</span>Loans</a>
        <a href="{{ url_for('reports.index') }}" class="{% if request.endpoint and request.endpoint.startswith('reports.') %}active{% endif %}"><span>▥</span>Reports</a>
    </nav>
    <div class="sidebar-bottom">
        <div class="sidebar-user"><span class="user-avatar">{{ current_user.username[:1]|upper }}</span><span><strong>{{ current_user.username }}</strong><small>Personal account</small></span></div>
        <form method="POST" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="sidebar-logout" type="submit"><span>⇥</span>Log out</button>
        </form>
    </div>
</aside>
{% endif %}
