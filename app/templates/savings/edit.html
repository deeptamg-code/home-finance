
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Savings Goal | Home Finance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-savings-edit">

    <div class="navbar">
        <strong>Home Finance — Savings Management</strong>
    </div>

    <div class="container">

        <h2>Edit Savings Goal</h2>

        <form method="POST">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="name">Goal Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ goal.name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="target_amount">Target Amount (JPY)</label>
                <input
                    type="number"
                    id="target_amount"
                    name="target_amount"
                    value="{{ goal.target_amount }}"
                    min="0.01"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="opening_balance">Opening Balance (JPY)</label>
                <input
                    type="number"
                    id="opening_balance"
                    name="opening_balance"
                    value="{{ goal.opening_balance }}"
                    min="0"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                >{{ goal.description or '' }}</textarea>
            </div>

            <div class="buttons">
                <button type="submit">Update Goal</button>

                <a href="{{ url_for('savings.index') }}"
                   class="back-link">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</body>
</html>
