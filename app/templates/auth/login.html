
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Home Finance</title>

    <!-- PWA settings -->
    <meta name="theme-color" content="#172554">
    <meta name="description" content="Your personal finance overview">

    <link rel="manifest"
          href="{{ url_for('static', filename='manifest.webmanifest') }}">

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='home-finance-kd-icon-192.png') }}">

    <link rel="apple-touch-icon"
          href="{{ url_for('static', filename='home-finance-kd-icon-192.png') }}">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Home Finance">

    <!-- Existing stylesheet -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-auth-login">

    <div class="login-container">

        <h1>
            <img class="site-logo"
                 src="{{ url_for('static', filename='kd-logo.jpg') }}"
                 alt="">
            Home Finance
        </h1>

        <p class="subtitle">Welcome back! Please login.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Create Account</a>
        </p>

    </div>

    <!-- PWA service worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/sw.js")
                    .then(function (registration) {
                        console.log(
                            "Home Finance PWA ready:",
                            registration.scope
                        );
                    })
                    .catch(function (error) {
                        console.error("PWA registration failed:", error);
                    });
            });
        }
    </script>

</body>
</html>
